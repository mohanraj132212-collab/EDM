<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EDM - Outdoor Navigation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      border-top: 3px solid #1685ff;
      overflow: hidden;
    }
    .app { height: calc(100dvh - 3px); display: flex; flex-direction: column; }
    .topbar {
      min-height: 137px;
      padding: 12px 24px 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-rows: 60px 42px;
      column-gap: 16px;
      align-items: center;
    }
    /* Intentionally blank: no logo or branding image. */
    .logo-placeholder {
      width: 60px; height: 60px; border-radius: 50%;
      background: #fff; grid-column: 1; grid-row: 1;
    }
    .menu-button {
      grid-column: 2; grid-row: 1 / span 2;
      width: 48px; height: 48px; border: 0; background: transparent;
      color: #fff; font-size: 36px; line-height: 1; cursor: pointer;
      padding: 0;
    }
    .search-form {
      grid-column: 1; grid-row: 2;
      width: min(100%, 320px); height: 42px;
      display: flex; align-items: center;
      background: #fff; border-radius: 24px; overflow: hidden;
    }
    .search-form input {
      border: 0; outline: 0; background: transparent; color: #222;
      flex: 1; min-width: 0; padding: 0 0 0 15px; font-size: 13px;
    }
    .search-form input::placeholder { color: #777; }
    .search-form button {
      border: 0; background: transparent; color: #666; cursor: pointer;
      height: 42px; width: 48px; font-size: 19px;
    }
    .status {
      min-height: 0; padding: 0 24px 8px; color: #d9d9d9;
      font-size: 12px; line-height: 1.35;
    }
    .map-shell {
      flex: 1; min-height: 0; margin: 0 23px 0;
      border-radius: 40px; overflow: hidden; background: #fff;
      position: relative; isolation: isolate;
    }
    #map { height: 100%; width: 100%; background: #f5f5f5; }
    .leaflet-control-zoom {
      border: 0 !important; border-radius: 5px !important;
      overflow: hidden; box-shadow: none !important;
    }
    .leaflet-control-zoom a {
      background: #000 !important; color: #fff !important;
      border: 0 !important; width: 30px !important; height: 29px !important;
      line-height: 29px !important;
    }
    .leaflet-control-zoom a:first-child { border-bottom: 1px solid #777 !important; }
    .leaflet-top.leaflet-left { top: 26px; left: 20px; }
    .leaflet-control-attribution { font-size: 9px !important; }
    .locate-button {
      position: absolute; z-index: 500; top: 103px; left: 30px;
      width: 30px; height: 30px; border: 0; border-radius: 5px;
      background: #000; color: #fff; font-size: 17px; cursor: pointer;
      display: grid; place-items: center;
    }
    .locate-button:disabled { opacity: .65; cursor: wait; }
    @media (max-width: 480px) {
      .topbar { padding-left: 18px; padding-right: 18px; }
      .map-shell { margin-left: 14px; margin-right: 14px; border-radius: 30px; }
      .status { padding-left: 18px; padding-right: 18px; }
      .locate-button { left: 25px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="logo-placeholder" aria-label="Blank logo area"></div>
      <form class="search-form" id="searchForm">
        <input id="placeSearch" type="search" placeholder="Search your place" autocomplete="off" aria-label="Search your place" />
        <button type="submit" aria-label="Search">⌕</button>
      </form>
      <button class="menu-button" id="settingsButton" aria-label="Settings" title="Settings">☰</button>
    </header>
    <div class="status" id="status" role="status" aria-live="polite">Search for a place or tap the location button to find where you are.</div>
    <section class="map-shell" aria-label="Navigation map">
      <div id="map"></div>
      <button class="locate-button" id="locateButton" aria-label="Go to my current location" title="My location">◎</button>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const statusBox = document.getElementById("status");
    const searchInput = document.getElementById("placeSearch");
    const locateButton = document.getElementById("locateButton");

    // Coimbatore is only the initial fallback view; it is not treated as the user's GPS location.
    const map = L.map("map", { zoomControl: false }).setView([11.0168, 76.9558], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    L.control.zoom({ position: "topleft" }).addTo(map);

    let userMarker = null;
    let accuracyCircle = null;
    let searchMarker = null;
    let latestLocationRequest = 0;

    document.getElementById("settingsButton").addEventListener("click", () => {
      alert("Settings feature is under development.");
    });

    document.getElementById("searchForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) {
        statusBox.textContent = "Please enter a place to search.";
        searchInput.focus();
        return;
      }

      statusBox.textContent = "Searching for " + query + "...";
      try {
        const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q=" + encodeURIComponent(query);
        const response = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!response.ok) throw new Error("Search service is temporarily unavailable.");
        const results = await response.json();

        if (!results.length) {
          statusBox.textContent = "Place not found. Try a more specific place or area name.";
          return;
        }

        const place = results[0];
        const lat = Number(place.lat);
        const lng = Number(place.lon);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) throw new Error("The location result was invalid.");

        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.marker([lat, lng]).addTo(map);
        searchMarker.bindPopup(
          L.popup().setContent((() => {
            const label = document.createElement("span");
            label.textContent = place.display_name || query;
            return label;
          })())
        );
        map.flyTo([lat, lng], 16, { duration: 1.0 });
        searchMarker.openPopup();
        statusBox.textContent = "Showing: " + (place.display_name || query);
      } catch (error) {
        console.error(error);
        statusBox.textContent = "Could not search right now. Check your internet connection and try again.";
      }
    });

    function showCurrentLocation(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      if (!userMarker) {
        userMarker = L.circleMarker([lat, lng], {
          radius: 8, color: "#fff", weight: 3, fillColor: "#1685ff", fillOpacity: 1
        }).addTo(map).bindPopup("You are here");
        accuracyCircle = L.circle([lat, lng], {
          radius: accuracy, color: "#1685ff", weight: 1, fillColor: "#1685ff", fillOpacity: 0.10
        }).addTo(map);
      } else {
        userMarker.setLatLng([lat, lng]);
        accuracyCircle.setLatLng([lat, lng]);
        accuracyCircle.setRadius(accuracy);
      }

      map.flyTo([lat, lng], 17, { duration: 1.0 });
      userMarker.openPopup();
      statusBox.textContent = "Your location found. Accuracy: about " + Math.round(accuracy) + " metres.";
      locateButton.disabled = false;
    }

    function locationError(error) {
      const messages = {
        1: "Location permission denied. Allow location access in your browser settings.",
        2: "Your location is unavailable. Check your device's location settings.",
        3: "Location timed out. Please tap the location button to try again."
      };
      statusBox.textContent = messages[error.code] || "Could not find your location.";
      locateButton.disabled = false;
    }

    function locateMe() {
      if (!("geolocation" in navigator)) {
        statusBox.textContent = "This browser does not support location tracking.";
        return;
      }
      latestLocationRequest++;
      const requestId = latestLocationRequest;
      locateButton.disabled = true;
      statusBox.textContent = "Finding your current location...";
      navigator.geolocation.getCurrentPosition(
        (position) => { if (requestId === latestLocationRequest) showCurrentLocation(position); },
        (error) => { if (requestId === latestLocationRequest) locationError(error); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
    locateButton.addEventListener("click", locateMe);

    // Keep the user's marker updated when the browser provides GPS fixes.
    // Location tracking starts only after the user taps the location button.
  </script>
</body>
</html>
