
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDM Outdoor Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 15px;
      background: #123b66;
      color: white;
      text-align: center;
    }

    #map {
      height: calc(100vh - 52px);
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <b>EDM - Outdoor Building Map</b>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Temporary location: Coimbatore
    const map = L.map("map").setView(
      [11.0168, 76.9558],
      17
    );

    L.tileLayer(
      "https://tiles.openfreemap.org/styles/liberty/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution:
          '&copy; OpenStreetMap contributors &copy; OpenFreeMap'
      }
    ).addTo(map);
  </script>
</body>
</html>
