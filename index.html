<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>EDM – Easy Direction Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root {
    --accent: #2f80ff;
    --radius: 28px;
    --edge: 12px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg { display: block; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Thin blue line along the top edge */
  .topline { position: fixed; inset: 0 0 auto 0; height: 2px; background: var(--accent); z-index: 3000; }

  .app { height: 100%; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .top {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    row-gap: 14px;
    padding: calc(env(safe-area-inset-top) + 16px) calc(var(--edge) + 4px) 14px;
  }
  .logo { width: 46px; height: 46px; border-radius: 50%; background: #fff; }
  .menu-btn { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; }
  .menu-btn svg { width: 28px; height: 28px; }

  .search {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    height: 52px;
    padding-left: 22px;
    background: #fff;
    color: #111;
    border-radius: 999px;
  }
  .search:focus-within { box-shadow: 0 0 0 3px rgba(47, 128, 255, .6); }
  .search input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: #111;
    font-size: 16px; /* 16px stops iOS from zooming on focus */
  }
  .search input::placeholder { color: #6b6b6b; }
  .search button { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%; color: #111; }
  .search button svg { width: 24px; height: 24px; }
  .search.loading button svg { animation: spin 0.9s linear infinite; }

  /* ---------- Map ---------- */
  .map-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
    margin: 0 var(--edge) calc(var(--edge) + env(safe-area-inset-bottom));
    border-radius: var(--radius);
    overflow: hidden;
    isolation: isolate;
    background: #f2f2f2;
  }
  #map { position: absolute; inset: 0; background: #f2f2f2; }
  .leaflet-control-attribution { border-radius: 8px 0 0 0; font-size: 11px; }
  .leaflet-bottom.leaflet-right .leaflet-control { margin-right: 14px; margin-bottom: 0; border-radius: 8px 8px 0 0; }

  .controls {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ctrl {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    background: #000;
    color: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
  }
  .ctrl svg { width: 22px; height: 22px; }
  .ctrl:disabled { opacity: .4; cursor: default; }
  .ctrl.busy svg { animation: spin 1s linear infinite; }
  .zoom { display: flex; flex-direction: column; gap: 2px; }
  .zoom .ctrl:first-child { border-radius: 12px 12px 4px 4px; }
  .zoom .ctrl:last-child { border-radius: 4px 4px 12px 12px; }

  /* ---------- Markers ---------- */
  .me { position: relative; width: 18px; height: 18px; }
  .me::before, .me::after { content: ""; position: absolute; border-radius: 50%; }
  .me::before { inset: -9px; background: rgba(47, 128, 255, .25); animation: ping 2s ease-out infinite; }
  .me::after { inset: 0; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .45); }
  .pin svg { width: 32px; height: 42px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .4)); }
  .leaflet-div-icon.edm-icon { background: none; border: 0; }
  .popup-name { font-size: 14px; line-height: 1.4; max-width: 230px; }

  /* ---------- Toast ---------- */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 34px;
    z-index: 1100;
    max-width: calc(100% - 28px);
    padding: 12px 18px;
    background: #000;
    color: #fff;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .4);
    opacity: 0;
    transform: translate(-50%, 8px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: #b3261e; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .me::before, .search.loading button svg, .ctrl.busy svg { animation: none; }
    .toast { transition: none; }
  }
  @media (min-width: 900px) {
    :root { --edge: 20px; }
    .top { padding-left: 24px; padding-right: 24px; }
    .search { max-width: 640px; }
  }
</style>
</head>
<body>
<div class="topline"></div>

<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"></div>

    <button class="menu-btn" id="menuBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search your place" aria-label="Search your place" enterkeyhint="search" maxlength="200">
      <button type="submit" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
      </button>
    </form>
  </header>

  <main class="map-wrap">
    <div id="map" aria-label="Interactive map"></div>

    <div class="controls" id="controls">
      <div class="zoom">
        <button class="ctrl" id="zoomIn" type="button" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="ctrl" id="zoomOut" type="button" aria-label="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
      </div>
      <button class="ctrl" id="locateBtn" type="button" aria-label="Show my current location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  "use strict";

  /* =====================================================================
     EDM – Easy Direction Map
     Modules: Config → State → Ui → MapView → Gps → Search → Settings
     ROUTING (future): read EDM.state.user and EDM.state.destination, or
     listen for the "edm:user-located" and "edm:destination-set" events on
     document. A Routing module can be added after Search without changes
     to the modules below.
     ===================================================================== */

  const Config = {
    defaultCenter: [20.5937, 78.9629],   // neutral country-level view; NOT the user's location
    defaultZoom: 5,
    maxZoom: 19,
    flyMaxZoom: 17,
    tileUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors',
    nominatimUrl: "https://nominatim.openstreetmap.org/search",
    minSearchGapMs: 1100,                // Nominatim policy: max 1 request per second
    searchTimeoutMs: 12000,
    geo: { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 },
    settingsMessage: "Settings feature is under development."
  };

  const State = { user: null, destination: null };   // { lat, lng, accuracy? } / { lat, lng, name }
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const emit = (name, detail) => document.dispatchEvent(new CustomEvent(name, { detail }));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ---------------------------- UI helpers --------------------------- */
  const Ui = {
    toastTimer: null,
    toast(message, type = "info", ms = 5000) {
      const el = $("toast");
      el.textContent = message;
      el.classList.toggle("error", type === "error");
      el.classList.add("show");
      clearTimeout(this.toastTimer);
      this.toastTimer = setTimeout(() => el.classList.remove("show"), ms);
    }
  };

  /* ------------------------------ Map -------------------------------- */
  const MapView = {
    map: null,
    init() {
      this.map = L.map("map", {
        zoomControl: false,
        center: Config.defaultCenter,
        zoom: Config.defaultZoom,
        maxZoom: Config.maxZoom,
        worldCopyJump: true
      });

      const tiles = L.tileLayer(Config.tileUrl, { maxZoom: Config.maxZoom, attribution: Config.attribution }).addTo(this.map);

      let warned = false;
      tiles.on("tileerror", () => {
        if (warned) return;
        warned = true;
        Ui.toast("Map tiles could not be loaded. Check your internet connection and try again.", "error", 8000);
        setTimeout(() => (warned = false), 10000);
      });

      // Keep control clicks from reaching the map
      L.DomEvent.disableClickPropagation($("controls"));
      L.DomEvent.disableScrollPropagation($("controls"));

      $("zoomIn").addEventListener("click", () => this.map.zoomIn());
      $("zoomOut").addEventListener("click", () => this.map.zoomOut());
      this.map.on("zoomend", () => this.syncZoomButtons());
      this.syncZoomButtons();

      setTimeout(() => this.map.invalidateSize(), 0);
    },
    syncZoomButtons() {
      $("zoomIn").disabled = this.map.getZoom() >= this.map.getMaxZoom();
      $("zoomOut").disabled = this.map.getZoom() <= this.map.getMinZoom();
    },
    fly(bounds) {
      this.map.flyToBounds(bounds, { maxZoom: Config.flyMaxZoom, padding: [40, 40], animate: !reduceMotion });
    }
  };

  /* ------------------------- Current location ------------------------ */
  const Gps = {
    marker: null,
    circle: null,
    busy: false,

    locate() {
      if (!("geolocation" in navigator)) {
        Ui.toast("Your browser does not support location services.", "error");
        return;
      }
      if (this.busy) return;
      this.setBusy(true);
      // One-off request only — no continuous tracking.
      navigator.geolocation.getCurrentPosition(
        (pos) => this.onFix(pos),
        (err) => this.onError(err),
        Config.geo
      );
    },

    setBusy(on) {
      this.busy = on;
      const btn = $("locateBtn");
      btn.classList.toggle("busy", on);
      btn.setAttribute("aria-busy", String(on));
    },

    onFix(pos) {
      this.setBusy(false);
      const { latitude: lat, longitude: lng, accuracy } = pos.coords;
      const latlng = [lat, lng];
      const metres = Math.round(accuracy);

      const label = document.createElement("div");
      label.className = "popup-name";
      label.textContent = `You are here (accuracy about ${metres} m)`;

      if (this.marker) {                       // update, never duplicate
        this.marker.setLatLng(latlng);
        this.circle.setLatLng(latlng).setRadius(accuracy);
        this.marker.setPopupContent(label);
      } else {
        this.circle = L.circle(latlng, {
          radius: accuracy, color: "#1a73e8", weight: 1, fillColor: "#1a73e8", fillOpacity: 0.15, interactive: false
        }).addTo(MapView.map);
        this.marker = L.marker(latlng, {
          icon: L.divIcon({ className: "edm-icon", html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }),
          keyboard: false, zIndexOffset: 500
        }).addTo(MapView.map).bindPopup(label, { autoPan: false });
      }

      State.user = { lat, lng, accuracy };
      emit("edm:user-located", State.user);
      MapView.fly(this.circle.getBounds());

      const rough = accuracy > 1000 ? " This is a rough, network-based position." : "";
      Ui.toast(`Location found. Accuracy is about ${metres} m.${rough}`, "info", 6000);
    },

    onError(err) {
      this.setBusy(false);
      let msg;
      switch (err.code) {
        case 1:
          msg = window.isSecureContext
            ? "Location permission was denied. Allow location access for this site in your browser settings and try again."
            : "Location needs a secure page. Open this file over HTTPS or from localhost.";
          break;
        case 2: msg = "Your location is unavailable right now. Check that GPS or network location is turned on."; break;
        case 3: msg = "Finding your location took too long. Move to an open area and try again."; break;
        default: msg = "Could not get your location. Please try again.";
      }
      Ui.toast(msg, "error", 7000);
    }
  };

  /* --------------------------- Place search -------------------------- */
  const Search = {
    marker: null,
    busy: false,
    lastRequestAt: 0,

    pinIcon: L.divIcon({
      className: "edm-icon pin",
      html: '<svg viewBox="0 0 32 42"><path d="M16 1C8 1 1.5 7.4 1.5 15.3 1.5 26 16 41 16 41s14.5-15 14.5-25.7C30.5 7.4 24 1 16 1z" fill="#e53935" stroke="#fff" stroke-width="2"/><circle cx="16" cy="15.5" r="5.2" fill="#fff"/></svg>',
      iconSize: [32, 42], iconAnchor: [16, 40], popupAnchor: [0, -36]
    }),

    setLoading(on) {
      this.busy = on;
      $("searchForm").classList.toggle("loading", on);
      $("searchBtn").disabled = on;
    },

    async run(rawQuery) {
      const query = rawQuery.trim();
      if (!query) {
        Ui.toast("Enter a place to search for.");
        $("searchInput").focus();
        return;
      }
      if (this.busy) return;
      this.setLoading(true);

      const controller = new AbortController();
      let timer;
      try {
        const wait = this.lastRequestAt + Config.minSearchGapMs - Date.now();
        if (wait > 0) await sleep(wait);
        this.lastRequestAt = Date.now();

        const params = new URLSearchParams({
          q: query,
          format: "jsonv2",
          limit: "1",
          "accept-language": navigator.language || "en"
        });
        timer = setTimeout(() => controller.abort(), Config.searchTimeoutMs);
        const res = await fetch(`${Config.nominatimUrl}?${params}`, { signal: controller.signal });

        if (res.status === 429) throw new Error("rate-limit");
        if (!res.ok) throw new Error("http");
        const results = await res.json();

        if (!Array.isArray(results) || results.length === 0) {
          Ui.toast(`No place found for "${query}". Check the spelling or try a more general name.`);
          return;
        }
        this.showDestination(results[0]);
      } catch (err) {
        if (err.name === "AbortError") Ui.toast("The search timed out. Please try again.", "error");
        else if (err.message === "rate-limit") Ui.toast("Too many searches. Wait a moment and try again.", "error");
        else if (err instanceof TypeError) Ui.toast("Could not reach the search service. Check your internet connection.", "error");
        else Ui.toast("The search service had a problem. Please try again later.", "error");
      } finally {
        clearTimeout(timer);
        this.setLoading(false);
      }
    },

    showDestination(place) {
      const lat = parseFloat(place.lat);
      const lng = parseFloat(place.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        Ui.toast("That result had no usable coordinates. Try another search.", "error");
        return;
      }
      const name = place.display_name || "Selected place";

      const label = document.createElement("div");
      label.className = "popup-name";
      label.textContent = name;

      if (this.marker) {                       // reuse the single destination marker
        this.marker.setLatLng([lat, lng]).setPopupContent(label);
      } else {
        this.marker = L.marker([lat, lng], { icon: this.pinIcon, title: name })
          .addTo(MapView.map)
          .bindPopup(label, { autoPan: false, maxWidth: 260 });
      }
      this.marker.openPopup();

      State.destination = { lat, lng, name };
      emit("edm:destination-set", State.destination);

      const bb = place.boundingbox;             // [south, north, west, east]
      if (Array.isArray(bb) && bb.length === 4) {
        const [s, n, w, e] = bb.map(parseFloat);
        MapView.fly(L.latLngBounds([s, w], [n, e]));
      } else {
        MapView.map.flyTo([lat, lng], 16, { animate: !reduceMotion });
      }
    }
  };

  /* ----------------------------- Settings ---------------------------- */
  const Settings = {
    open() { alert(Config.settingsMessage); }
  };

  /* ------------------------------ Boot ------------------------------- */
  MapView.init();
  $("locateBtn").addEventListener("click", () => Gps.locate());
  $("menuBtn").addEventListener("click", () => Settings.open());
  $("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();                         // Enter key or search icon
    Search.run($("searchInput").value);
  });

  window.EDM = { Config, State, MapView, Gps, Search };   // handle for future modules
})();
</script>
</body>
</html>
